    <!-- 
  Academic affiliations logo banner
  - Drop this section anywhere in your page (e.g. under your bio/header)
  - Replace src/alt/href for each logo with your own
  - Logos display grayscale by default, full color on hover
  - Adjust --logo-height to make logos bigger/smaller
-->

<style>
  .affiliations {
    --logo-height: 100px;
    --gap: 48px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: left;
    gap: var(--gap);
    padding: 24px 16px;
    margin: 32px 0;
  }

  .affiliations img {
    height: var(--logo-height);
    width: auto;
    max-width: 160px;
    object-fit: contain;
    filter: grayscale(100%) opacity(0.65);
    transition: filter 0.2s ease;
  }

  .affiliations a:hover img,
  .affiliations a:focus img {
    filter: grayscale(0%) opacity(1);
  }

  /* Optional: smaller logos on narrow screens */
  @media (max-width: 600px) {
    .affiliations {
      --logo-height: 30px;
      --gap: 28px;
    }
  }
</style>

<hr>
